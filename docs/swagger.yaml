host: localhost:3000
info:
  contact: {}
  description: |-
    Reads customer data from the local MySQL database imported from the WordPress/WooCommerce SQL dump. It does not call the live website.

    The dump's tables use the `wp5u_` prefix, including `wp5u_wc_customer_lookup`, `wp5u_wc_order_stats` and `wp5u_usermeta`.
  title: Sacrop Customer API
  version: "1.0"
paths:
  /api/customers:
    get:
      description: Returns WooCommerce customers with their completed/processing order
        count and total spend, de-duplicated by email address in SQL so that paging
        never repeats or skips a customer. `total` is the number of unique customers
        in the database, not just in this page. Use `limit=all` to fetch every customer
        in one response.
      parameters:
      - default: "50"
        description: Rows per response, or `all` for every customer
        in: query
        name: limit
        type: string
      - default: 0
        description: Rows to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/customer.CustomerListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: List customers with order totals
      tags:
      - customers
  /api/customers/{id}:
    get:
      description: Returns a single customer by WooCommerce customer ID, including
        an order summary and the registration timestamp.
      parameters:
      - description: WooCommerce customer ID
        example: 1471
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/customer.DetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Get one customer
      tags:
      - customers
  /api/customers/profiles:
    get:
      description: Returns customer profile data without order information, one row
        per row of wp5u_wc_customer_lookup (so the same email can appear more than
        once). `total` is the full row count of that table. Use `limit=all` to fetch
        every row in one response.
      parameters:
      - default: "50"
        description: Rows per response, or `all` for every row
        in: query
        name: limit
        type: string
      - default: 0
        description: Rows to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/customer.ProfileListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: List customer profiles
      tags:
      - customers
  /health:
    get:
      description: Confirms the HTTP server is responding. It does not independently
        verify the database after startup.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HealthResponse'
      summary: Health check
      tags:
      - system
produces:
- application/json
schemes:
- http
- https
swagger: "2.0"
tags:
- description: Customer records from the WooCommerce analytics tables
  name: customers
- description: Service health
  name: system
